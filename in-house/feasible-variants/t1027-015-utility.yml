rule:
  meta:
    name: request compression via explicit utility command
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Requests compression of a file; compression as payload concealment requires qualification. Static
      function-local references are capability candidates only. Dynamic observations require the separate typed
      launch contract; neither proves utility completion or malicious intent.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Stealth::Obfuscated Files or Information::Compression [T1027.015]
    references:
    - https://attack.mitre.org/techniques/T1027/015/
  features:
  - and:
    - or:
      - api: CreateProcess
      - api: CreateProcessInternal
      - api: CreateProcessAsUser
      - api: CreateProcessWithToken
      - api: CreateProcessWithLogon
    - string: /\A(?:"(?:[^"\r\n]*[\\/])?compact(?:\.exe)?"|(?:[^\\/\s"\r\n]+[\\/])*compact(?:\.exe)?)[ \t]+/c[ \t]+(?:"[^"\r\n]+"|[^\s"\r\n&|<>]+)[
        \t]*\Z/i
