rule:
  meta:
    name: request modify authentication process via explicit utility command
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Requests a known authentication-process modification mechanism; patching success is unproven. Static
      function-local references are capability candidates only. Dynamic observations require the separate typed
      launch contract; neither proves utility completion or malicious intent.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Credential Access::Modify Authentication Process [T1556]
    - Defense Impairment::Modify Authentication Process [T1556]
    - Persistence::Modify Authentication Process [T1556]
    references:
    - https://attack.mitre.org/techniques/T1556/
  features:
  - and:
    - or:
      - api: CreateProcess
      - api: CreateProcessInternal
      - api: CreateProcessAsUser
      - api: CreateProcessWithToken
      - api: CreateProcessWithLogon
    - string: /\A(?:"(?:[^"\r\n]*[\\/])?mimikatz(?:\.exe)?"|(?:[^\\/\s"\r\n]+[\\/])*mimikatz(?:\.exe)?)[ \t]+"misc::skeleton"[
        \t]+"exit"[ \t]*\Z/i
