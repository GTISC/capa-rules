rule:
  meta:
    name: request steal or forge authentication certificates via explicit utility command
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Requests export of identity certificate and private-key material; its authentication use and origin
      remain unproven. Static function-local references are capability candidates only. Dynamic observations require
      the separate typed launch contract; neither proves utility completion or malicious intent.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Credential Access::Steal or Forge Authentication Certificates [T1649]
    - Lateral Movement::Steal or Forge Authentication Certificates [T1649]
    - Persistence::Steal or Forge Authentication Certificates [T1649]
    - Privilege Escalation::Steal or Forge Authentication Certificates [T1649]
    references:
    - https://attack.mitre.org/techniques/T1649/
  features:
  - and:
    - or:
      - api: CreateProcess
      - api: CreateProcessInternal
      - api: CreateProcessAsUser
      - api: CreateProcessWithToken
      - api: CreateProcessWithLogon
    - string: /\A(?:"(?:[^"\r\n]*[\\/])?certutil(?:\.exe)?"|(?:[^\\/\s"\r\n]+[\\/])*certutil(?:\.exe)?)[ \t]+-exportPFX[
        \t]+my[ \t]+[0-9a-f]+[ \t]+(?:"[^"\r\n]+"|[^\s"\r\n&|<>]+)[ \t]*\Z/i
