rule:
  meta:
    name: request run virtual instance via explicit utility command
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Requests running a virtual machine without its normal visible console. Static function-local references
      are capability candidates only. Dynamic observations require the separate typed launch contract; neither proves
      utility completion or malicious intent.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Stealth::Hide Artifacts::Run Virtual Instance [T1564.006]
    references:
    - https://attack.mitre.org/techniques/T1564/006/
  features:
  - and:
    - or:
      - api: CreateProcess
      - api: CreateProcessInternal
      - api: CreateProcessAsUser
      - api: CreateProcessWithToken
      - api: CreateProcessWithLogon
    - string: /\A(?:"(?:[^"\r\n]*[\\/])?vboxmanage(?:\.exe)?"|(?:[^\\/\s"\r\n]+[\\/])*vboxmanage(?:\.exe)?)[ \t]+startvm[
        \t]+(?:"[^"\r\n]+"|[\w.-]+)[ \t]+--type[ \t]+headless[ \t]*\Z/i
