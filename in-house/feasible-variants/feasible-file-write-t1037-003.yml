rule:
  meta:
    name: reference write bound file variant for Network Logon Script
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Writes a network-domain logon script location; active policy assignment is unproven. Static references
      are function-local candidates; the bound dynamic contract is separate.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Persistence::Boot or Logon Initialization Scripts::Network Logon Script [T1037.003]
    - Privilege Escalation::Boot or Logon Initialization Scripts::Network Logon Script [T1037.003]
    references:
    - https://attack.mitre.org/techniques/T1037/003/
  features:
  - and:
    - api: CreateFile
    - api: WriteFile
    - string: /\A\\\\[^\\]+\\SYSVOL\\[^\\]+\\scripts\\[^\r\n]+\.(?:bat|cmd|ps1|vbs)\Z/i
