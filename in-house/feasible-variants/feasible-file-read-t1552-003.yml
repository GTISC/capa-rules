rule:
  meta:
    name: reference read bound file variant for Shell History
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Reads a persistent PowerShell history file that may contain credentials. Static references are
      function-local candidates; the bound dynamic contract is separate.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Credential Access::Unsecured Credentials::Shell History [T1552.003]
    references:
    - https://attack.mitre.org/techniques/T1552/003/
  features:
  - and:
    - api: CreateFile
    - api: ReadFile
    - string: /\A[A-Z]:\\Users\\[^\\]+\\AppData\\Roaming\\Microsoft\\Windows\\PowerShell\\PSReadLine\\ConsoleHost_history\.txt\Z/i
