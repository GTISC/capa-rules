rule:
  meta:
    name: request rogue domain controller via explicit utility command
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Requests DCShadow replication from a rogue-controller workflow; domain registration and replication
      are unproven. Static function-local references are capability candidates only. Dynamic observations require
      the separate typed launch contract; neither proves utility completion or malicious intent.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Defense Impairment::Rogue Domain Controller [T1207]
    references:
    - https://attack.mitre.org/techniques/T1207/
  features:
  - and:
    - or:
      - api: CreateProcess
      - api: CreateProcessInternal
      - api: CreateProcessAsUser
      - api: CreateProcessWithToken
      - api: CreateProcessWithLogon
    - string: /\A(?:"(?:[^"\r\n]*[\\/])?mimikatz(?:\.exe)?"|(?:[^\\/\s"\r\n]+[\\/])*mimikatz(?:\.exe)?)[ \t]+"lsadump::dcshadow[
        \t]+/push"[ \t]+"exit"[ \t]*\Z/i
