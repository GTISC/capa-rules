rule:
  meta:
    name: request as-rep roasting via explicit utility command
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Requests AS-REP roasting output to a named file. Static function-local references are capability
      candidates only. Dynamic observations require the separate typed launch contract; neither proves utility completion
      or malicious intent.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Credential Access::Steal or Forge Kerberos Tickets::AS-REP Roasting [T1558.004]
    - Lateral Movement::Steal or Forge Kerberos Tickets::AS-REP Roasting [T1558.004]
    - Persistence::Steal or Forge Kerberos Tickets::AS-REP Roasting [T1558.004]
    - Privilege Escalation::Steal or Forge Kerberos Tickets::AS-REP Roasting [T1558.004]
    references:
    - https://attack.mitre.org/techniques/T1558/004/
  features:
  - and:
    - or:
      - api: CreateProcess
      - api: CreateProcessInternal
      - api: CreateProcessAsUser
      - api: CreateProcessWithToken
      - api: CreateProcessWithLogon
    - string: /\A(?:"(?:[^"\r\n]*[\\/])?rubeus(?:\.exe)?"|(?:[^\\/\s"\r\n]+[\\/])*rubeus(?:\.exe)?)[ \t]+asreproast[
        \t]+/outfile:[^\s&|<>]+[ \t]*\Z/i
