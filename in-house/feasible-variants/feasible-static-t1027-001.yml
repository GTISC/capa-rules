rule:
  meta:
    name: contain a large uniform PE overlay
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: At least 64 KiB and one quarter of the file is uniform zero/FF overlay outside the certificate
      region. This is a structural padding candidate, not proof of deliberate scan evasion. Static capability candidate
      only; never qualified runtime evidence.
    scopes:
      static: file
      dynamic: unsupported
    att&ck:
    - Stealth::Obfuscated Files or Information::Binary Padding [T1027.001]
    references:
    - https://attack.mitre.org/techniques/T1027/001/
  features:
  - and:
    - format: pe
    - characteristic: large uniform pe overlay
