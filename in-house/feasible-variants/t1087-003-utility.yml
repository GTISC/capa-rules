rule:
  meta:
    name: request email account via explicit utility command
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Requests enumeration of mail-enabled accounts. Static function-local references are capability
      candidates only. Dynamic observations require the separate typed launch contract; neither proves utility completion
      or malicious intent.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Discovery::Account Discovery::Email Account [T1087.003]
    references:
    - https://attack.mitre.org/techniques/T1087/003/
  features:
  - and:
    - or:
      - api: CreateProcess
      - api: CreateProcessInternal
      - api: CreateProcessAsUser
      - api: CreateProcessWithToken
      - api: CreateProcessWithLogon
    - string: /\A(?:"(?:[^"\r\n]*[\\/])?powershell(?:\.exe)?"|(?:[^\\/\s"\r\n]+[\\/])*powershell(?:\.exe)?)[ \t]+-NoProfile[
        \t]+-Command[ \t]+"Get-Mailbox(?:[ \t]+-ResultSize[ \t]+Unlimited)?"[ \t]*\Z/i
