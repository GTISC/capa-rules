rule:
  meta:
    name: request sharepoint via explicit utility command
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Requests downloading a specific SharePoint repository file. Static function-local references are
      capability candidates only. Dynamic observations require the separate typed launch contract; neither proves
      utility completion or malicious intent.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Collection::Data from Information Repositories::Sharepoint [T1213.002]
    references:
    - https://attack.mitre.org/techniques/T1213/002/
  features:
  - and:
    - or:
      - api: CreateProcess
      - api: CreateProcessInternal
      - api: CreateProcessAsUser
      - api: CreateProcessWithToken
      - api: CreateProcessWithLogon
    - string: /\A(?:"(?:[^"\r\n]*[\\/])?powershell(?:\.exe)?"|(?:[^\\/\s"\r\n]+[\\/])*powershell(?:\.exe)?)[ \t]+-NoProfile[
        \t]+-Command[ \t]+"Get-PnPFile[ \t]+-Url[ \t]+[^\s"]+[ \t]+-Path[ \t]+[^\s"]+[ \t]+-AsFile"[ \t]*\Z/i
