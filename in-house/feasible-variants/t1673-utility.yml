rule:
  meta:
    name: request virtual machine discovery via explicit utility command
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Requests enumeration of hosted virtual machines, rather than checking whether the current guest
      is virtualized. Static function-local references are capability candidates only. Dynamic observations require
      the separate typed launch contract; neither proves utility completion or malicious intent.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Discovery::Virtual Machine Discovery [T1673]
    references:
    - https://attack.mitre.org/techniques/T1673/
  features:
  - and:
    - or:
      - api: CreateProcess
      - api: CreateProcessInternal
      - api: CreateProcessAsUser
      - api: CreateProcessWithToken
      - api: CreateProcessWithLogon
    - string: /\A(?:"(?:[^"\r\n]*[\\/])?powershell(?:\.exe)?"|(?:[^\\/\s"\r\n]+[\\/])*powershell(?:\.exe)?)[ \t]+-NoProfile[
        \t]+-Command[ \t]+"Get-VM"[ \t]*\Z/i
