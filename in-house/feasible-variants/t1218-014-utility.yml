rule:
  meta:
    name: request mmc via explicit utility command
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Requests loading an MMC console document; its executable content needs inspection. Static function-local
      references are capability candidates only. Dynamic observations require the separate typed launch contract;
      neither proves utility completion or malicious intent.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Stealth::System Binary Proxy Execution::MMC [T1218.014]
    references:
    - https://attack.mitre.org/techniques/T1218/014/
  features:
  - and:
    - or:
      - api: CreateProcess
      - api: CreateProcessInternal
      - api: CreateProcessAsUser
      - api: CreateProcessWithToken
      - api: CreateProcessWithLogon
    - string: /\A(?:"(?:[^"\r\n]*[\\/])?mmc(?:\.exe)?"|(?:[^\\/\s"\r\n]+[\\/])*mmc(?:\.exe)?)[ \t]+(?:"[^"\r\n]+\.msc"|[^\s"]+\.msc)[
        \t]*\Z/i
