rule:
  meta:
    name: reference set bound registry variant for Hidden Users
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Sets a named user logon-screen visibility DWORD to zero. Static references are function-local candidates;
      the bound dynamic contract is separate.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Stealth::Hide Artifacts::Hidden Users [T1564.002]
    references:
    - https://attack.mitre.org/techniques/T1564/002/
  features:
  - and:
    - api: RegSetValueEx
    - string: /\A(?:HKLM|HKEY_LOCAL_MACHINE)\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon\\SpecialAccounts\\UserList\Z/i
    - string: /\A[^\\\r\n]+\Z/i
    - number: 0
