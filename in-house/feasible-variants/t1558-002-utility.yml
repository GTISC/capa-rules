rule:
  meta:
    name: request silver ticket via explicit utility command
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Requests a forged service ticket using a service key and SPN components. Static function-local
      references are capability candidates only. Dynamic observations require the separate typed launch contract;
      neither proves utility completion or malicious intent.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Credential Access::Steal or Forge Kerberos Tickets::Silver Ticket [T1558.002]
    references:
    - https://attack.mitre.org/techniques/T1558/002/
  features:
  - and:
    - or:
      - api: CreateProcess
      - api: CreateProcessInternal
      - api: CreateProcessAsUser
      - api: CreateProcessWithToken
      - api: CreateProcessWithLogon
    - string: /\A(?:"(?:[^"\r\n]*[\\/])?mimikatz(?:\.exe)?"|(?:[^\\/\s"\r\n]+[\\/])*mimikatz(?:\.exe)?)[ \t]+"kerberos::golden[
        \t]+/user:[\w.-]+[ \t]+/domain:[\w.-]+[ \t]+/sid:S-[0-9-]+[ \t]+/target:[\w.-]+[ \t]+/service:[\w.-]+[ \t]+/rc4:[0-9a-f]{32}[
        \t]+/ptt"[ \t]+"exit"[ \t]*\Z/i
