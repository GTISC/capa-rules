rule:
  meta:
    name: request verclsid via explicit utility command
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Requests Verclsid activation of an explicit CLSID; registration and payload are unproven. Static
      function-local references are capability candidates only. Dynamic observations require the separate typed
      launch contract; neither proves utility completion or malicious intent.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Stealth::System Binary Proxy Execution::Verclsid [T1218.012]
    references:
    - https://attack.mitre.org/techniques/T1218/012/
  features:
  - and:
    - or:
      - api: CreateProcess
      - api: CreateProcessInternal
      - api: CreateProcessAsUser
      - api: CreateProcessWithToken
      - api: CreateProcessWithLogon
    - string: /\A(?:"(?:[^"\r\n]*[\\/])?verclsid(?:\.exe)?"|(?:[^\\/\s"\r\n]+[\\/])*verclsid(?:\.exe)?)[ \t]+/S[
        \t]+/C[ \t]+\{[0-9a-f-]{36}\}[ \t]*\Z/i
