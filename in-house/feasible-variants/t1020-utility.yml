rule:
  meta:
    name: request automated exfiltration via explicit utility command
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Requests a loop uploading each selected document as HTTP request content. It does not infer automation
      from an isolated send or claim upload success. Static function-local references are capability candidates
      only. Dynamic observations require the separate typed launch contract; neither proves utility completion or
      malicious intent.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Exfiltration::Automated Exfiltration [T1020]
    references:
    - https://attack.mitre.org/techniques/T1020/
  features:
  - and:
    - or:
      - api: CreateProcess
      - api: CreateProcessInternal
      - api: CreateProcessAsUser
      - api: CreateProcessWithToken
      - api: CreateProcessWithLogon
    - string: /\A(?:"(?:[^"\r\n]*[\\/])?powershell(?:\.exe)?"|(?:[^\\/\s"\r\n]+[\\/])*powershell(?:\.exe)?)[ \t]+-NoProfile[
        \t]+-Command[ \t]+"Get-ChildItem[ \t]+C:\\Users\\[^\\\s]+\\Documents[ \t]+-File[ \t]+\|[ \t]+ForEach-Object[
        \t]+\{[ \t]+Invoke-WebRequest[ \t]+-Uri[ \t]+https://[^\s"]+/upload[ \t]+-Method[ \t]+Post[ \t]+-InFile[
        \t]+\$_\.FullName[ \t]+\}"[ \t]*\Z/i
