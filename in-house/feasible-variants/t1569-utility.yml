rule:
  meta:
    name: request system services via explicit utility command
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Requests execution through an existing Windows service, an explicit parent mechanism. Static function-local
      references are capability candidates only. Dynamic observations require the separate typed launch contract;
      neither proves utility completion or malicious intent.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Execution::System Services [T1569]
    references:
    - https://attack.mitre.org/techniques/T1569/
  features:
  - and:
    - or:
      - api: CreateProcess
      - api: CreateProcessInternal
      - api: CreateProcessAsUser
      - api: CreateProcessWithToken
      - api: CreateProcessWithLogon
    - string: /\A(?:"(?:[^"\r\n]*[\\/])?sc(?:\.exe)?"|(?:[^\\/\s"\r\n]+[\\/])*sc(?:\.exe)?)[ \t]+start[ \t]+[\w.-]+[
        \t]*\Z/i
