rule:
  meta:
    name: reference set bound registry variant for Office Test
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Sets the Office Test Perf DLL value on its exact key, not an arbitrary Office setting. Static references
      are function-local candidates; the bound dynamic contract is separate.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Persistence::Office Application Startup::Office Test [T1137.002]
    references:
    - https://attack.mitre.org/techniques/T1137/002/
  features:
  - and:
    - api: RegSetValueEx
    - string: /\A(?:HKLM|HKEY_LOCAL_MACHINE)\\SOFTWARE\\Microsoft\\Office test\\Special\Z/i
    - string: /\APerf\Z/i
    - string: /\A[A-Z]:\\[^\r\n]+\.dll\Z/i
