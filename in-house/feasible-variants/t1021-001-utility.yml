rule:
  meta:
    name: request remote desktop protocol via explicit utility command
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Requests an RDP connection to a named peer, without asserting login. Static function-local references
      are capability candidates only. Dynamic observations require the separate typed launch contract; neither proves
      utility completion or malicious intent.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Lateral Movement::Remote Services::Remote Desktop Protocol [T1021.001]
    references:
    - https://attack.mitre.org/techniques/T1021/001/
  features:
  - and:
    - or:
      - api: CreateProcess
      - api: CreateProcessInternal
      - api: CreateProcessAsUser
      - api: CreateProcessWithToken
      - api: CreateProcessWithLogon
    - string: /\A(?:"(?:[^"\r\n]*[\\/])?mstsc(?:\.exe)?"|(?:[^\\/\s"\r\n]+[\\/])*mstsc(?:\.exe)?)[ \t]+/v:[\w.-]+(?::[0-9]+)?[
        \t]*\Z/i
