rule:
  meta:
    name: request rdp hijacking via explicit utility command
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Requests RDP session reassignment; session ownership and unauthorized hijacking need qualification.
      Static function-local references are capability candidates only. Dynamic observations require the separate
      typed launch contract; neither proves utility completion or malicious intent.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Lateral Movement::Remote Service Session Hijacking::RDP Hijacking [T1563.002]
    references:
    - https://attack.mitre.org/techniques/T1563/002/
  features:
  - and:
    - or:
      - api: CreateProcess
      - api: CreateProcessInternal
      - api: CreateProcessAsUser
      - api: CreateProcessWithToken
      - api: CreateProcessWithLogon
    - string: /\A(?:"(?:[^"\r\n]*[\\/])?tscon(?:\.exe)?"|(?:[^\\/\s"\r\n]+[\\/])*tscon(?:\.exe)?)[ \t]+[1-9][0-9]*[
        \t]+/dest:console[ \t]*\Z/i
