rule:
  meta:
    name: request pass the ticket via explicit utility command
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Requests injection/reuse of a supplied Kerberos ticket. Static function-local references are capability
      candidates only. Dynamic observations require the separate typed launch contract; neither proves utility completion
      or malicious intent.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Lateral Movement::Use Alternate Authentication Material::Pass the Ticket [T1550.003]
    references:
    - https://attack.mitre.org/techniques/T1550/003/
  features:
  - and:
    - or:
      - api: CreateProcess
      - api: CreateProcessInternal
      - api: CreateProcessAsUser
      - api: CreateProcessWithToken
      - api: CreateProcessWithLogon
    - string: /\A(?:"(?:[^"\r\n]*[\\/])?rubeus(?:\.exe)?"|(?:[^\\/\s"\r\n]+[\\/])*rubeus(?:\.exe)?)[ \t]+ptt[ \t]+/ticket:[^\s&|<>]+[
        \t]*\Z/i
