rule:
  meta:
    name: request ide extensions via explicit utility command
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Requests installation of a local IDE extension package; its code and activation need inspection.
      Static function-local references are capability candidates only. Dynamic observations require the separate
      typed launch contract; neither proves utility completion or malicious intent.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Persistence::Software Extensions::IDE Extensions [T1176.002]
    references:
    - https://attack.mitre.org/techniques/T1176/002/
  features:
  - and:
    - or:
      - api: CreateProcess
      - api: CreateProcessInternal
      - api: CreateProcessAsUser
      - api: CreateProcessWithToken
      - api: CreateProcessWithLogon
    - string: /\A(?:"(?:[^"\r\n]*[\\/])?code(?:\.exe)?"|(?:[^\\/\s"\r\n]+[\\/])*code(?:\.exe)?)[ \t]+--install-extension[
        \t]+(?:"[^"\r\n]+\.vsix"|[^\s"]+\.vsix)[ \t]*\Z/i
