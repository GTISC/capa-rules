rule:
  meta:
    name: request protocol tunneling via explicit utility command
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Requests SSH local port forwarding with explicit inner and outer endpoints. Static function-local
      references are capability candidates only. Dynamic observations require the separate typed launch contract;
      neither proves utility completion or malicious intent.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Command and Control::Protocol Tunneling [T1572]
    references:
    - https://attack.mitre.org/techniques/T1572/
  features:
  - and:
    - or:
      - api: CreateProcess
      - api: CreateProcessInternal
      - api: CreateProcessAsUser
      - api: CreateProcessWithToken
      - api: CreateProcessWithLogon
    - string: /\A(?:"(?:[^"\r\n]*[\\/])?plink(?:\.exe)?"|(?:[^\\/\s"\r\n]+[\\/])*plink(?:\.exe)?)[ \t]+-ssh[ \t]+[\w.@-]+[
        \t]+-L[ \t]+[0-9]+:[\w.-]+:[0-9]+[ \t]+-N[ \t]*\Z/i
