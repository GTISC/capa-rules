rule:
  meta:
    name: request electron applications via explicit utility command
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Requests an Electron application with a debugging interface; abuse needs payload/context qualification.
      Static function-local references are capability candidates only. Dynamic observations require the separate
      typed launch contract; neither proves utility completion or malicious intent.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Stealth::System Binary Proxy Execution::Electron Applications [T1218.015]
    references:
    - https://attack.mitre.org/techniques/T1218/015/
  features:
  - and:
    - or:
      - api: CreateProcess
      - api: CreateProcessInternal
      - api: CreateProcessAsUser
      - api: CreateProcessWithToken
      - api: CreateProcessWithLogon
    - string: /\A(?:"(?:[^"\r\n]*[\\/])?electron(?:\.exe)?"|(?:[^\\/\s"\r\n]+[\\/])*electron(?:\.exe)?)[ \t]+--inspect=[0-9]+[
        \t]+(?:"[^"\r\n]+"|[^\s"\r\n&|<>]+)[ \t]*\Z/i
