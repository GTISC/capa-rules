rule:
  meta:
    name: reference set bound registry variant for Terminal Services DLL
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Redirects the Terminal Services DLL configuration; later service loading and binary provenance
      remain unproven. Static references are function-local candidates; the bound dynamic contract is separate.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Persistence::Server Software Component::Terminal Services DLL [T1505.005]
    references:
    - https://attack.mitre.org/techniques/T1505/005/
  features:
  - and:
    - api: RegSetValueEx
    - string: /\A(?:HKLM|HKEY_LOCAL_MACHINE)\\SYSTEM\\CurrentControlSet\\Services\\TermService\\Parameters\Z/i
    - string: /\AServiceDll\Z/i
    - string: /\A[A-Z]:\\[^\r\n]+\.dll\Z/i
