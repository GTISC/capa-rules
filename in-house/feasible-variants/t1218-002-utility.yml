rule:
  meta:
    name: request control panel via explicit utility command
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Requests execution/loading of a control-panel module. Static function-local references are capability
      candidates only. Dynamic observations require the separate typed launch contract; neither proves utility completion
      or malicious intent.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Stealth::System Binary Proxy Execution::Control Panel [T1218.002]
    references:
    - https://attack.mitre.org/techniques/T1218/002/
  features:
  - and:
    - or:
      - api: CreateProcess
      - api: CreateProcessInternal
      - api: CreateProcessAsUser
      - api: CreateProcessWithToken
      - api: CreateProcessWithLogon
    - string: /\A(?:"(?:[^"\r\n]*[\\/])?control(?:\.exe)?"|(?:[^\\/\s"\r\n]+[\\/])*control(?:\.exe)?)[ \t]+(?:"[^"\r\n]+\.cpl"|[^\s"]+\.cpl)[
        \t]*\Z/i
