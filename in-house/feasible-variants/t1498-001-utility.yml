rule:
  meta:
    name: request direct network flood via explicit utility command
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Requests direct high-rate traffic generation, rather than reflection/amplification. Static function-local
      references are capability candidates only. Dynamic observations require the separate typed launch contract;
      neither proves utility completion or malicious intent.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Impact::Network Denial of Service::Direct Network Flood [T1498.001]
    references:
    - https://attack.mitre.org/techniques/T1498/001/
  features:
  - and:
    - or:
      - api: CreateProcess
      - api: CreateProcessInternal
      - api: CreateProcessAsUser
      - api: CreateProcessWithToken
      - api: CreateProcessWithLogon
    - string: /\A(?:"(?:[^"\r\n]*[\\/])?nping(?:\.exe)?"|(?:[^\\/\s"\r\n]+[\\/])*nping(?:\.exe)?)[ \t]+--tcp[ \t]+--flags[
        \t]+syn[ \t]+--rate[ \t]+[1-9][0-9]{4,}[ \t]+-c[ \t]+0[ \t]+[0-9.]+[ \t]*\Z/i
