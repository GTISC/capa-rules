rule:
  meta:
    name: request dcsync via explicit utility command
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Requests DCSync with an explicit domain and user; DRS replication needs separate evidence. Static
      function-local references are capability candidates only. Dynamic observations require the separate typed
      launch contract; neither proves utility completion or malicious intent.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Credential Access::OS Credential Dumping::DCSync [T1003.006]
    references:
    - https://attack.mitre.org/techniques/T1003/006/
  features:
  - and:
    - or:
      - api: CreateProcess
      - api: CreateProcessInternal
      - api: CreateProcessAsUser
      - api: CreateProcessWithToken
      - api: CreateProcessWithLogon
    - string: /\A(?:"(?:[^"\r\n]*[\\/])?mimikatz(?:\.exe)?"|(?:[^\\/\s"\r\n]+[\\/])*mimikatz(?:\.exe)?)[ \t]+"lsadump::dcsync[
        \t]+/domain:[\w.-]+[ \t]+/user:[\w.\\-]+"[ \t]+"exit"[ \t]*\Z/i
