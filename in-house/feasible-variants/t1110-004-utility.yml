rule:
  meta:
    name: request credential stuffing via explicit utility command
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Requests use of a credential-pair list; stolen/reused credential origin is not inferred. Static
      function-local references are capability candidates only. Dynamic observations require the separate typed
      launch contract; neither proves utility completion or malicious intent.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Credential Access::Brute Force::Credential Stuffing [T1110.004]
    references:
    - https://attack.mitre.org/techniques/T1110/004/
  features:
  - and:
    - or:
      - api: CreateProcess
      - api: CreateProcessInternal
      - api: CreateProcessAsUser
      - api: CreateProcessWithToken
      - api: CreateProcessWithLogon
    - string: /\A(?:"(?:[^"\r\n]*[\\/])?hydra(?:\.exe)?"|(?:[^\\/\s"\r\n]+[\\/])*hydra(?:\.exe)?)[ \t]+(?-i:-C)[
        \t]+(?:"[^"\r\n]+"|[^\s"\r\n&|<>]+)[ \t]+rdp://[\w.-]+[ \t]*\Z/i
