rule:
  meta:
    name: request ide tunneling via explicit utility command
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Requests a named IDE remote tunnel; server registration, access, and authorization need qualification.
      Static function-local references are capability candidates only. Dynamic observations require the separate
      typed launch contract; neither proves utility completion or malicious intent.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Command and Control::Remote Access Tools::IDE Tunneling [T1219.001]
    references:
    - https://attack.mitre.org/techniques/T1219/001/
  features:
  - and:
    - or:
      - api: CreateProcess
      - api: CreateProcessInternal
      - api: CreateProcessAsUser
      - api: CreateProcessWithToken
      - api: CreateProcessWithLogon
    - string: /\A(?:"(?:[^"\r\n]*[\\/])?code(?:\.exe)?"|(?:[^\\/\s"\r\n]+[\\/])*code(?:\.exe)?)[ \t]+tunnel[ \t]+--accept-server-license-terms[
        \t]+--name[ \t]+[\w.-]+[ \t]*\Z/i
