rule:
  meta:
    name: reference read bound file variant for Browser Information Discovery
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Reads nonempty browser history/bookmark/preference data from a bound profile file. Static references
      are function-local candidates; the bound dynamic contract is separate.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Discovery::Browser Information Discovery [T1217]
    references:
    - https://attack.mitre.org/techniques/T1217/
  features:
  - and:
    - api: CreateFile
    - api: ReadFile
    - string: /\A[A-Z]:\\Users\\[^\\]+\\AppData\\Local\\(?:Google\\Chrome|Microsoft\\Edge)\\User Data\\(?:Default|Profile
        [0-9]+)\\(?:History|Bookmarks|Preferences)\Z/i
