rule:
  meta:
    name: reference write bound file variant for LSASS Driver
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Writes an LSASS security-subsystem DLL path; existing identity, actual replacement, load, and persistence
      need qualification. Static references are function-local candidates; the bound dynamic contract is separate.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Persistence::Boot or Logon Autostart Execution::LSASS Driver [T1547.008]
    - Privilege Escalation::Boot or Logon Autostart Execution::LSASS Driver [T1547.008]
    references:
    - https://attack.mitre.org/techniques/T1547/008/
  features:
  - and:
    - api: CreateFile
    - api: WriteFile
    - string: /\A[A-Z]:\\Windows\\System32\\(?:msv1_0|lsasrv|samsrv)\.dll\Z/i
