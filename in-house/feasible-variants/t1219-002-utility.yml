rule:
  meta:
    name: request remote desktop software via explicit utility command
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Requests an AnyDesk peer session using a concrete peer ID. Static function-local references are
      capability candidates only. Dynamic observations require the separate typed launch contract; neither proves
      utility completion or malicious intent.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Command and Control::Remote Access Tools::Remote Desktop Software [T1219.002]
    references:
    - https://attack.mitre.org/techniques/T1219/002/
  features:
  - and:
    - or:
      - api: CreateProcess
      - api: CreateProcessInternal
      - api: CreateProcessAsUser
      - api: CreateProcessWithToken
      - api: CreateProcessWithLogon
    - string: /\A(?:"(?:[^"\r\n]*[\\/])?anydesk(?:\.exe)?"|(?:[^\\/\s"\r\n]+[\\/])*anydesk(?:\.exe)?)[ \t]+[1-9][0-9]{8}[
        \t]*\Z/i
