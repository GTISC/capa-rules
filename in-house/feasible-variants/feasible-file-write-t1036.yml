rule:
  meta:
    name: reference write bound file variant for Masquerading
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Writes a filename disguising an executable extension behind a document extension; file content
      and user presentation remain unproven. Static references are function-local candidates; the bound dynamic
      contract is separate.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Stealth::Masquerading [T1036]
    references:
    - https://attack.mitre.org/techniques/T1036/
  features:
  - and:
    - api: CreateFile
    - api: WriteFile
    - string: /\A[A-Z]:\\[^\r\n]+\.(?:pdf|docx?|xlsx?|jpg|png)\.(?:exe|scr)\Z/i
