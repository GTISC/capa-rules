rule:
  meta:
    name: reference read bound file variant for Local Email Collection
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Reads nonempty content from a bound Outlook mail-store file. Static references are function-local
      candidates; the bound dynamic contract is separate.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Collection::Email Collection::Local Email Collection [T1114.001]
    references:
    - https://attack.mitre.org/techniques/T1114/001/
  features:
  - and:
    - api: CreateFile
    - api: ReadFile
    - string: /\A[A-Z]:\\Users\\[^\\]+\\(?:AppData\\Local\\Microsoft\\Outlook|Documents\\Outlook Files)\\[^\\]+\.(?:pst|ost)\Z/i
