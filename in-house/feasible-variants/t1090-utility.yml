rule:
  meta:
    name: request proxy via explicit utility command
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Requests a concrete TCP forwarding proxy configuration; C2 use is unproven. Static function-local
      references are capability candidates only. Dynamic observations require the separate typed launch contract;
      neither proves utility completion or malicious intent.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Command and Control::Proxy [T1090]
    references:
    - https://attack.mitre.org/techniques/T1090/
  features:
  - and:
    - or:
      - api: CreateProcess
      - api: CreateProcessInternal
      - api: CreateProcessAsUser
      - api: CreateProcessWithToken
      - api: CreateProcessWithLogon
    - string: /\A(?:"(?:[^"\r\n]*[\\/])?netsh(?:\.exe)?"|(?:[^\\/\s"\r\n]+[\\/])*netsh(?:\.exe)?)[ \t]+interface[
        \t]+portproxy[ \t]+add[ \t]+v4tov4[ \t]+listenport=[0-9]+[ \t]+listenaddress=[0-9.]+[ \t]+connectport=[0-9]+[
        \t]+connectaddress=[0-9.]+[ \t]*\Z/i
