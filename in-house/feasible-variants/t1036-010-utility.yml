rule:
  meta:
    name: request masquerade account name via explicit utility command
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Requests creation of a user whose trailing dollar imitates a computer account; account creation
      is unproven. Static function-local references are capability candidates only. Dynamic observations require
      the separate typed launch contract; neither proves utility completion or malicious intent.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Stealth::Masquerading::Masquerade Account Name [T1036.010]
    references:
    - https://attack.mitre.org/techniques/T1036/010/
  features:
  - and:
    - or:
      - api: CreateProcess
      - api: CreateProcessInternal
      - api: CreateProcessAsUser
      - api: CreateProcessWithToken
      - api: CreateProcessWithLogon
    - string: /\A(?:"(?:[^"\r\n]*[\\/])?net(?:\.exe)?"|(?:[^\\/\s"\r\n]+[\\/])*net(?:\.exe)?)[ \t]+user[ \t]+[\w.-]+\$[
        \t]+[^\s&|<>]+[ \t]+/add[ \t]*\Z/i
