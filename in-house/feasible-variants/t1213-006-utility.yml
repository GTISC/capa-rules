rule:
  meta:
    name: request databases via explicit utility command
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Requests exporting records from a named database table. Static function-local references are capability
      candidates only. Dynamic observations require the separate typed launch contract; neither proves utility completion
      or malicious intent.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Collection::Data from Information Repositories::Databases [T1213.006]
    - Command and Control::Data from Information Repositories::Databases [T1213.006]
    - Exfiltration::Data from Information Repositories::Databases [T1213.006]
    - Lateral Movement::Data from Information Repositories::Databases [T1213.006]
    references:
    - https://attack.mitre.org/techniques/T1213/006/
  features:
  - and:
    - or:
      - api: CreateProcess
      - api: CreateProcessInternal
      - api: CreateProcessAsUser
      - api: CreateProcessWithToken
      - api: CreateProcessWithLogon
    - string: /\A(?:"(?:[^"\r\n]*[\\/])?sqlcmd(?:\.exe)?"|(?:[^\\/\s"\r\n]+[\\/])*sqlcmd(?:\.exe)?)[ \t]+-S[ \t]+[\w.\\-]+[
        \t]+-d[ \t]+[\w]+[ \t]+-Q[ \t]+"SELECT[ \t]+\*[ \t]+FROM[ \t]+[\w.\[\]]+;?"[ \t]+-o[ \t]+[^\s"]+[ \t]*\Z/i
