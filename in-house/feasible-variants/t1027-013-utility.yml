rule:
  meta:
    name: request encrypted/encoded file via explicit utility command
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Requests creation of an encrypted file; its payload role and evasion intent remain unproven. Static
      function-local references are capability candidates only. Dynamic observations require the separate typed
      launch contract; neither proves utility completion or malicious intent.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Stealth::Obfuscated Files or Information::Encrypted/Encoded File [T1027.013]
    references:
    - https://attack.mitre.org/techniques/T1027/013/
  features:
  - and:
    - or:
      - api: CreateProcess
      - api: CreateProcessInternal
      - api: CreateProcessAsUser
      - api: CreateProcessWithToken
      - api: CreateProcessWithLogon
    - string: /\A(?:"(?:[^"\r\n]*[\\/])?openssl(?:\.exe)?"|(?:[^\\/\s"\r\n]+[\\/])*openssl(?:\.exe)?)[ \t]+enc[
        \t]+-aes-256-cbc[ \t]+-in[ \t]+(?:"[^"\r\n]+"|[^\s"\r\n&|<>]+)[ \t]+-out[ \t]+(?:"[^"\r\n]+"|[^\s"\r\n&|<>]+)[
        \t]+-pass[ \t]+file:(?:"[^"\r\n]+"|[^\s"\r\n&|<>]+)[ \t]*\Z/i
