rule:
  meta:
    name: request local accounts via explicit utility command
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Requests execution under a machine-local account; successful credentials are not inferred. Static
      function-local references are capability candidates only. Dynamic observations require the separate typed
      launch contract; neither proves utility completion or malicious intent.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Initial Access::Valid Accounts::Local Accounts [T1078.003]
    - Persistence::Valid Accounts::Local Accounts [T1078.003]
    - Privilege Escalation::Valid Accounts::Local Accounts [T1078.003]
    - Stealth::Valid Accounts::Local Accounts [T1078.003]
    references:
    - https://attack.mitre.org/techniques/T1078/003/
  features:
  - and:
    - or:
      - api: CreateProcess
      - api: CreateProcessInternal
      - api: CreateProcessAsUser
      - api: CreateProcessWithToken
      - api: CreateProcessWithLogon
    - string: /\A(?:"(?:[^"\r\n]*[\\/])?runas(?:\.exe)?"|(?:[^\\/\s"\r\n]+[\\/])*runas(?:\.exe)?)[ \t]+/user:\.[\\][\w.-]+[
        \t]+(?:"[^"\r\n]+\.exe"|[^\s"\r\n&|<>]+\.exe)[ \t]*\Z/i
