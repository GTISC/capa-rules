rule:
  meta:
    name: request password cracking via explicit utility command
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Requests offline hash cracking with hash and dictionary operands. Static function-local references
      are capability candidates only. Dynamic observations require the separate typed launch contract; neither proves
      utility completion or malicious intent.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Credential Access::Brute Force::Password Cracking [T1110.002]
    references:
    - https://attack.mitre.org/techniques/T1110/002/
  features:
  - and:
    - or:
      - api: CreateProcess
      - api: CreateProcessInternal
      - api: CreateProcessAsUser
      - api: CreateProcessWithToken
      - api: CreateProcessWithLogon
    - string: /\A(?:"(?:[^"\r\n]*[\\/])?hashcat(?:\.exe)?"|(?:[^\\/\s"\r\n]+[\\/])*hashcat(?:\.exe)?)[ \t]+-m[ \t]+[0-9]+[
        \t]+-a[ \t]+0[ \t]+(?:"[^"\r\n]+"|[^\s"\r\n&|<>]+)[ \t]+(?:"[^"\r\n]+"|[^\s"\r\n&|<>]+)[ \t]*\Z/i
