rule:
  meta:
    name: request brute force via explicit utility command
    namespace: in-house/feasible-variants
    authors:
    - MalwareLab
    description: Requests online password-list guessing against an explicit remote service. Static function-local
      references are capability candidates only. Dynamic observations require the separate typed launch contract;
      neither proves utility completion or malicious intent.
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
    - Credential Access::Brute Force [T1110]
    references:
    - https://attack.mitre.org/techniques/T1110/
  features:
  - and:
    - or:
      - api: CreateProcess
      - api: CreateProcessInternal
      - api: CreateProcessAsUser
      - api: CreateProcessWithToken
      - api: CreateProcessWithLogon
    - string: /\A(?:"(?:[^"\r\n]*[\\/])?hydra(?:\.exe)?"|(?:[^\\/\s"\r\n]+[\\/])*hydra(?:\.exe)?)[ \t]+(?-i:-l)[
        \t]+[\w.-]+[ \t]+(?-i:-P)[ \t]+(?:"[^"\r\n]+"|[^\s"\r\n&|<>]+)[ \t]+rdp://[\w.-]+[ \t]*\Z/i
