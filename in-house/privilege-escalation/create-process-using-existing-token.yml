rule:
  meta:
    name: create process using existing token
    namespace: in-house/privilege-escalation
    authors:
    - MalwareLab
    description: Invokes the dedicated existing-token process creation API. The token origin, identity change, and
      child execution must be separately bound. Static matches are capability candidates; dynamic matches are observations
      from successful calls, not proof of adversary intent or technique completion.
    scopes:
      static: function
      dynamic: call
    att&ck:
    - Privilege Escalation::Create Process with Token [T1134.002]
    references:
    - https://attack.mitre.org/techniques/T1134/002/
  features:
  - api: CreateProcessWithToken
