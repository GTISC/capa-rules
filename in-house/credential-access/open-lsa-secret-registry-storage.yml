rule:
  meta:
    name: open lsa secret registry storage
    namespace: in-house/credential-access
    authors:
    - MalwareLab
    description: Opens the SECURITY\Policy\Secrets registry subtree identified in the official definition. Secret
      retrieval and decryption require separate value and data-flow evidence. Static matches are capability candidates;
      dynamic matches are observations from successful calls, not proof of adversary intent or technique completion.
    scopes:
      static: function
      dynamic: call
    att&ck:
    - Credential Access::LSA Secrets [T1003.004]
    references:
    - https://attack.mitre.org/techniques/T1003/004/
  features:
  - and:
    - or:
      - api: RegOpenKeyEx
      - api: RegOpenKey
    - string: /(?:\A|[\\/])SECURITY[\\/]Policy[\\/]Secrets(?:[\\/].*)?\Z/i
