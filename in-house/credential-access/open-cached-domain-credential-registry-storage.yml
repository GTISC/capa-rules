rule:
  meta:
    name: open cached domain credential registry storage
    namespace: in-house/credential-access
    authors:
    - MalwareLab
    description: Opens the registry cache containing cached domain logon material. Access is a candidate, not proof
      that NL$ credential entries were read or recovered. Static matches are capability candidates; dynamic matches
      are observations from successful calls, not proof of adversary intent or technique completion.
    scopes:
      static: function
      dynamic: call
    att&ck:
    - Credential Access::Cached Domain Credentials [T1003.005]
    references:
    - https://attack.mitre.org/techniques/T1003/005/
  features:
  - and:
    - or:
      - api: RegOpenKeyEx
      - api: RegOpenKey
    - string: /(?:\A|[\\/])SECURITY[\\/]Cache\Z/i
