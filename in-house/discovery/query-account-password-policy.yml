rule:
  meta:
    name: query account password policy
    namespace: in-house/discovery
    authors:
    - MalwareLab
    description: Queries account policy information with NetUserModalsGet, as opposed to modifying it. The information
      level and returned policy contents require further qualification. Static matches are capability candidates;
      dynamic matches are observations from successful calls, not proof of adversary intent or technique completion.
    scopes:
      static: function
      dynamic: call
    att&ck:
    - Discovery::Password Policy Discovery [T1201]
    references:
    - https://attack.mitre.org/techniques/T1201/
  features:
  - api: NetUserModalsGet
