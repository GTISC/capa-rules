rule:
  meta:
    name: enumerate domain accounts with net
    namespace: in-house/discovery
    authors:
    - MalwareLab
    description: Directly launches the domain account enumeration command with an explicit domain selector. Static
      matches are capability candidates; dynamic matches are observations from successful calls, not proof of adversary
      intent or technique completion.
    scopes:
      static: function
      dynamic: call
    att&ck:
    - Discovery::Domain Account [T1087.002]
    references:
    - https://attack.mitre.org/techniques/T1087/002/
  features:
  - and:
    - or:
      - api: CreateProcess
      - api: CreateProcessInternal
      - api: CreateProcessAsUser
      - api: CreateProcessWithToken
    - string: /\A(?:"(?:[^"\r\n]*[\\/])?(?:net)(?:\.exe)?"|(?:[^\\/\s"\r\n]+[\\/])*(?:net)(?:\.exe)?)[ \t]+user[
        \t]+/domain[ \t]*\Z/i
