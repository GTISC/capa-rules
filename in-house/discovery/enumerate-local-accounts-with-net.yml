rule:
  meta:
    name: enumerate local accounts with net
    namespace: in-house/discovery
    authors:
    - MalwareLab
    description: Directly launches the local account enumeration command. Domain enumeration and account creation
      are excluded. Static matches are capability candidates; dynamic matches are observations from successful calls,
      not proof of adversary intent or technique completion.
    scopes:
      static: function
      dynamic: call
    att&ck:
    - Discovery::Local Account [T1087.001]
    references:
    - https://attack.mitre.org/techniques/T1087/001/
  features:
  - and:
    - or:
      - api: CreateProcess
      - api: CreateProcessInternal
      - api: CreateProcessAsUser
      - api: CreateProcessWithToken
    - string: /\A(?:"(?:[^"\r\n]*[\\/])?(?:net)(?:\.exe)?"|(?:[^\\/\s"\r\n]+[\\/])*(?:net)(?:\.exe)?)[ \t]+user[
        \t]*\Z/i
